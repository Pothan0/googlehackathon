<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Media Sentinel — Real-Time Piracy Detection & IP Enforcement</title>
  <meta name="description" content="Industry-grade platform for real-time forensic watermarking, content provenance, AI-driven piracy detection, and decentralized IP enforcement across global sports media distribution.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/sentinel.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav" id="main-nav">
    <div class="nav-logo">SMS <span>Sentinel</span></div>
    <div class="nav-divider"></div>
    <!-- nav-links injected by JS -->
    <div class="nav-status">
      <div class="status-dot" id="ws-dot"></div>
      <div class="status-label" id="ws-status">Connecting</div>
    </div>
  </nav>

  <!-- App Container -->
  <div class="page-container">
    <div id="app">
      <!-- Page content rendered here by SPA router -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 56px);color:var(--muted);">
        <div style="text-align:center;">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--accent);margin-bottom:8px;">SMS</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;">INITIALIZING SENTINEL…</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
